<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- ears -->
  <circle cx="36" cy="24" r="11" fill="#e39b52"/>
  <circle cx="84" cy="24" r="11" fill="#e39b52"/>
  <circle cx="36" cy="24" r="6" fill="#f7b3b3"/>
  <circle cx="84" cy="24" r="6" fill="#f7b3b3"/>
  <!-- body -->
  <ellipse cx="60" cy="84" rx="38" ry="32" fill="#e39b52"/>
  <ellipse cx="60" cy="92" rx="25" ry="21" fill="#fff3e0"/>
  <!-- feet -->
  <ellipse cx="44" cy="114" rx="9" ry="5" fill="#f2b9a0"/>
  <ellipse cx="76" cy="114" rx="9" ry="5" fill="#f2b9a0"/>
  <!-- head -->
  <circle cx="60" cy="48" r="31" fill="#e39b52"/>
  <ellipse cx="60" cy="60" rx="19" ry="14" fill="#fff3e0"/>
  <circle cx="38" cy="58" r="7" fill="#ff9e9e" opacity="0.6"/>
  <circle cx="82" cy="58" r="7" fill="#ff9e9e" opacity="0.6"/>
  <!-- happy eyes -->
  <path d="M43 45 q5 -7 10 0" stroke="#2b1d14" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M67 45 q5 -7 10 0" stroke="#2b1d14" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <ellipse cx="60" cy="55" rx="4" ry="3" fill="#e2777a"/>
  <!-- big smile -->
  <path d="M51 60 q9 11 18 0" stroke="#2b1d14" stroke-width="3" fill="#ff8a8a" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- left paw resting -->
  <ellipse cx="30" cy="84" rx="8" ry="10" fill="#f2c08a" stroke="#b8783c" stroke-width="2"/>
  <!-- thumbs-up paw -->
  <g stroke="#b8783c" stroke-width="2.5" fill="#f2c08a" stroke-linejoin="round">
    <rect x="86" y="44" width="10" height="26" rx="5"/>
    <rect x="80" y="64" width="26" height="22" rx="8"/>
    <path d="M84 71 h16 M84 78 h16" fill="none" stroke-linecap="round"/>
  </g>
</svg>
